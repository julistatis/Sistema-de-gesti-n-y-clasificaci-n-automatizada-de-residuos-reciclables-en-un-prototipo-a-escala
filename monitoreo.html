<!DOCTYPE html>

<body>

<h1>Monitoreo en Vivo</h1>

<p>Lote Oficial: <span id="lote">0 / 20</span></p>

Simular Corrida (20 Objetos)
</button>

<script>

function simularCorrida(){
 document.getElementById("lote").innerHTML="20 / 20";
 document.getElementById("metal").innerHTML="5";
}

</script>

</body>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulaciones</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f2f2;
}

header{
    background: #4A8D5A;
    color: white;
    text-align: center;
    padding: 80px 20px;
}

header h1{
    font-size: 60px;
    margin-bottom: 20px;
}

header p{
    font-size: 24px;
}

.boton-volver{
    background: #327143;
    text-align: center;
    padding: 25px;
}

.boton-volver a{
    color: white;
    text-decoration: none;
    font-size: 22px;
    font-weight: bold;
}

.contenedor{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 40px 20px;
}

.tarjeta{
    background: white;
    width: 500px;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.tarjeta h2{
    color: #4A8D5A;
    font-size: 30px;
}

.tarjeta img{
    width: 100%;
    border-radius: 10px;
    margin: 20px 0;
}

.boton{
    display: inline-block;
    padding: 15px 30px;
    background: #4A8D5A;
    color: white;
    font-weight: bold;
    text-decoration: none;
    border-radius: 10px;
    margin-top: 15px;
}

footer{
    text-align: center;
    background: #198754;
    color: white;
    padding: 20px;
    margin-top: 20px;
}

@media(max-width:768px){

    header h1{
        font-size: 40px;
    }

    .tarjeta{
        width: 90%;
    }

}
</style>

</head>
<body>

<header>
    <h1>Simulaciones</h1>
    <p>Pruebas virtuales del sistema de clasificación automatizada de residuos</p>
</header>

<div class="boton-volver">
    <a href="index.html">Volver a la página principal</a>
</div>

<div class="contenedor">

    <div class="tarjeta">
        <h2>Simulación 1 - Wokwi</h2>

        <img src="imagen 2 wokwi.png"
    alt="Simulación Wokwi">

        <a href="https://wokwi.com/projects/475815799753553921"
        target="_blank" class="boton">
            Ver simulación 1 en Wokwi
        </a>
    </div>

    <div class="tarjeta">
        <h2>Simulación 2 - Colab</h2>

        <img src="imagen 1.png"
    alt="Simulación Colab">

        <a href="https://colab.research.google.com/drive/1rgB5RShChGT-_jRKeGKsdGIWetleyGFn#scrollTo=6YVW-F1TWZDn"
        target="_blank" class="boton">
            Ver simulación 2 en Colab
        </a>

</div>

<footer>
    <p>Proyecto académico 2026 ♻️</p>
</footer>

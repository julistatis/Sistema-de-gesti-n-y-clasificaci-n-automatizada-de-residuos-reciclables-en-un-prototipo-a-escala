<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulaciones</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

/* ENCABEZADO */
header {
    background: #198754;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

/* BOTÓN VOLVER */
.boton-volver {
    background: #146c43;
    text-align: center;
    padding: 15px;
}

.boton-volver a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 5px;
}

.boton-volver a:hover {
    background: #198754;
}

/* CONTENEDOR */
.contenedor {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 40px 20px;
}

/* TARJETAS */
.tarjeta {
    background: white;
    width: 500px;
    border-radius: 18px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}

.tarjeta h2 {
    color: #198754;
    font-size: 30px;
}

/* IMÁGENES */
.tarjeta img {
    width: 100%;
    border-radius: 10px;
    margin: 20px 0;
}

/* BOTONES DE SIMULACIÓN */
.boton {
    display: inline-block;
    padding: 15px 30px;
    background: #198754;
    color: white;
    font-weight: bold;
    text-decoration: none;
    border-radius: 10px;
    margin-top: 15px;
}

.boton:hover {
    background: #146c43;
}

/* PIE DE PÁGINA */
footer {
    text-align: center;
    background: #198754;
    color: white;
    padding: 20px;
    margin-top: 20px;
}

/* CELULAR */
@media (max-width: 768px) {

    .contenedor {
        padding: 30px 15px;
    }

    .tarjeta {
        width: 90%;
        padding: 22px;
    }

    .tarjeta h2 {
        font-size: 26px;
    }
}

</style>

</head>

<body>

<header>
    <h1>Simulaciones</h1>
    <p>
        Pruebas virtuales del sistema de clasificación automatizada de residuos
    </p>
</header>

<div class="boton-volver">
    <a href="index.html">Volver a la página principal</a>
</div>

<div class="contenedor">

    <div class="tarjeta">

        <h2>Simulación 1 - Wokwi</h2>

        <img
            src="imagen 2 wokwi.png"
            alt="Simulación Wokwi"
        >

        <a
            href="https://wokwi.com/projects/475815799753553921"
            target="_blank"
            class="boton"
        >
            Ver simulación 1 en Wokwi
        </a>

    </div>


    <div class="tarjeta">

        <h2>Simulación 2 - Colab</h2>

        <img
            src="imagen 1.png"
            alt="Simulación Colab"
        >

        <a
            href="https://colab.research.google.com/drive/1rgB5RShChGT-\_jRKeGKsdGIWetleyGFn#scrollTo=6YVW-F1TWZDn"
            target="_blank"
            class="boton"
        >
            Ver simulación 2 en Colab
        </a>

    </div>

</div>

<footer>
    <p>Proyecto académico 2026 ♻️</p>
</footer>

</body>
</html>

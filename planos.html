<!DOCTYPE html>
<html lang="es">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
content="width=device-width,initial-scale=1.0">

  <title>Planos</title>
  
  <style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
    text-align: center;
}

header {
    background: #198754;
    color: white;
    padding: 35px 20px;
}

nav {
    background: #146c43;
    padding: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.simulaciones {
    width: 85%;
    max-width: 1000px;
    margin: 25px auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.tarjeta {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}

.tarjeta h2 {
    color: #198754;
}

.tarjeta img {
    width: 100%;
    max-width: 600px;
    height: 300px;
    object-fit: contain;
}

.tarjeta a {
    display: inline-block;
    background: #198754;
    color: white;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: bold;
}

footer {
    background: #198754;
    color: white;
    padding: 15px;
    margin-top: 30px;
}

@media (max-width: 700px) {
    .simulaciones {
        grid-template-columns: 1fr;
    }
}
.rotar{
    transform: rotate(-90deg);
    width: 300px;
}      
</style>

</head>
<body>

  <header>
     <h1>Planos</h1>
     <p>Diseños y planos del sistema de clasificacion automatizada de reisduos</p>
  </header>

  <nav>
    <a href="index.html"> Volver a la página principal</a>
  </nav>

  <main class="simulaciones">

      <section class="tarjeta">

  <h2>Primer boceto - Vista superior</h2>

  <img src="prototipo.jpeg"
  alt="Boceto - Vista superior"
  class="rotar">

  <br><br>

      </section>
      <section class="tarjeta">

          <h2>Segundo boceto - Vista frontal</h2>

<img src="prototipo.png"
alt="Boceto - Vista frontal"
width="600">

<br><br>

</section>
</main>

<footer>
    <p>Proyecto académico 2026 ♻️</p>
</footer>

</body>
</html>
